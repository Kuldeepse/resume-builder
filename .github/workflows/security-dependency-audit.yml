name: Dependency Security Audit

on:
  pull_request:
    paths:
      - 'jobfit-frontend/package*.json'
      - 'jobfit-backend/requirements.txt'
      - 'jobfit-discovery-worker/requirements.txt'
      - '.github/workflows/security-dependency-audit.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobfit-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jobfit-frontend/package-lock.json
      - name: Install locked dependencies without post-install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependency advisories (high and critical)
        run: npm audit --omit=dev --audit-level=high

  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source vulnerability auditor
        run: python -m pip install 'pip-audit>=2.7,<3'
      - name: Audit FastAPI backend requirements
        run: pip-audit -r jobfit-backend/requirements.txt
      - name: Audit discovery worker requirements
        run: pip-audit -r jobfit-discovery-worker/requirements.txt
