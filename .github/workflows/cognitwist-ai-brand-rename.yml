name: Apply CogniTwist AI brand rename

on:
  push:
    branches:
      - agent/add-career-network-mvp

permissions:
  contents: write

jobs:
  rename-brand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename product across text files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          excluded_parts = {'.git', 'node_modules', '.next'}
          protected_domain = '__COGNITWIST_PRODUCTION_DOMAIN__'
          changed = []

          for path in root.rglob('*'):
              if not path.is_file() or any(part in excluded_parts for part in path.parts):
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              text = original.replace('https://rolecraftai.duckdns.org', f'https://{protected_domain}')
              text = text.replace('rolecraftai.duckdns.org', protected_domain)

              text = text.replace('RoleCraft AI', 'CogniTwist AI')
              text = text.replace('RoleCraft', 'CogniTwist AI')
              text = re.sub(r'CogniTwist(?! AI)', 'CogniTwist AI', text)

              text = text.replace('CogniTwist AI - AI Career Intelligence', 'CogniTwist AI - Career Intelligence')
              text = text.replace('CogniTwist AI - AI', 'CogniTwist AI -')
              text = text.replace('rolecraft-theme-change', 'cognitwist-theme-change')
              text = text.replace('--font-rolecraft-', '--font-cognitwist-')
              text = text.replace('rolecraft_admin_session', 'cognitwist_admin_session')
              text = text.replace('>RC</', '>CT</')

              text = text.replace(f'https://{protected_domain}', 'https://rolecraftai.duckdns.org')
              text = text.replace(protected_domain, 'rolecraftai.duckdns.org')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} files')
          for item in changed:
              print(item)
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/cognitwist-ai-brand-rename.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No rename changes were needed."
            exit 0
          fi
          git commit -m "Rename product everywhere to CogniTwist AI"
          git push origin HEAD:agent/add-career-network-mvp
