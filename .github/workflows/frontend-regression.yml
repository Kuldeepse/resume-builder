name: Frontend Regression

on:
  push:
    branches: [main]
    paths:
      - 'jobfit-frontend/**'
      - '.github/workflows/frontend-regression.yml'
  pull_request:
    paths:
      - 'jobfit-frontend/**'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobfit-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jobfit-frontend/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run regression suite and production build
        run: npm run build
      - name: Run Live Interview end-to-end smoke
        run: node scripts/live-interview-e2e.mjs
